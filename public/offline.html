<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Offline - Muhammad Sayyid</title>
	</head>
	<body
		style="
			background-color: #020617;
			color: white;
			font-family: sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			text-align: center;
		"
	>
		<div
			style="
				background-color: #0f172a;
				padding: 40px;
				border-radius: 16px;
				border: 1px solid #1e293b;
				max-width: 350px;
				box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
			"
		>
			<div style="font-size: 50px; margin-bottom: 20px">📡</div>

			<h1 style="color: #06b6d4; font-size: 24px; margin-bottom: 10px">
				Oops! You're Offline
			</h1>

			<p
				style="
					color: #94a3b8;
					font-size: 16px;
					line-height: 1.5;
					margin-bottom: 25px;
				"
			>
				It seems you've lost your connection. Don't worry, my portfolio
				is cached and ready for you!
			</p>

			<button
				onclick="
					this.innerText = 'Checking...';
					window.location.reload();
				"
				style="
					background-color: #0891b2;
					color: white;
					border: none;
					padding: 12px 24px;
					border-radius: 8px;
					font-weight: bold;
					cursor: pointer;
					width: 100%;
					transition: 0.3s;
				"
				onmouseover="this.style.backgroundColor = '#06b6d4'"
				onmouseout="this.style.backgroundColor = '#0891b2'"
			>
				Try To Reconnect
			</button>

			<p style="margin-top: 20px; font-size: 12px; color: #475569">
				© Muhammad Sayyid • Secured & Offline-ready
			</p>
		</div>
	</body>
</html>
