<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>You're Offline | Muhammad Sayyid</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				overflow: hidden;
			}
			body {
				background-color: #020617;
				color: white;
				height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				text-align: center;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}
			.icon-wrap {
				position: relative;
				margin-bottom: 2rem;
				height: 96px;
				width: 96px;
				background-color: #0f172a;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 0 20px rgba(8, 145, 178, 0.4);
			}
			.icon-wrap span {
				font-size: 3rem;
			}
			.ping {
				position: absolute;
				top: -4px;
				right: -4px;
				height: 16px;
				width: 16px;
				background-color: #ef4444;
				border-radius: 50%;
				animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
			}
			@keyframes ping {
				75%,
				100% {
					transform: scale(2);
					opacity: 0;
				}
			}
			h1 {
				font-size: 2rem;
				font-weight: bold;
				margin-bottom: 0.5rem;
			}
			p {
				color: #94a3b8;
				max-width: 400px;
				margin-bottom: 2rem;
				line-height: 1.5;
			}
			button {
				background-color: #0891b2;
				color: white;
				padding: 12px 32px;
				border-radius: 12px;
				font-weight: 600;
				border: none;
				cursor: pointer;
				font-size: 1rem;
				transition: opacity 0.2s;
			}
			button:disabled {
				opacity: 0.7;
				cursor: not-allowed;
			}
			.spin {
				display: inline-block;
				width: 16px;
				height: 16px;
				border: 2px solid white;
				border-top-color: transparent;
				border-radius: 50%;
				animation: spin 1s linear infinite;
				vertical-align: middle;
				margin-right: 8px;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			footer {
				position: fixed;
				bottom: 1.5rem;
				left: 0;
				right: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 12px;
				color: #475569;
				font-size: 0.875rem;
			}
			.heart {
				color: #ef4444;
				display: inline-block;
				animation: heartBeat 1.5s ease-in-out infinite;
			}
			@keyframes heartBeat {
				0%,
				100% {
					transform: scale(1);
				}
				15% {
					transform: scale(1.2);
				}
				30% {
					transform: scale(1);
				}
				45% {
					transform: scale(1.15);
				}
			}
		</style>
	</head>
	<body>
		<div class="icon-wrap">
			<span>📡</span>
			<div class="ping"></div>
		</div>
		<h1>Oops! You're Offline</h1>
		<p>
			It seems you've lost your connection. Don't worry, my portfolio is
			designed to work even when you're disconnected!
		</p>
		<button id="btn" onclick="reconnect()">Try To Reconnect</button>
		<footer>
			<span>© <span id="yr"></span></span>
			<span style="color: #94a3b8; font-weight: 500"
				>Muhammad Sayyid</span
			>
			<span>•</span>
			<span>Developed with <span class="heart">❤️</span></span>
		</footer>
		<script>
			document.getElementById("yr").textContent =
				new Date().getFullYear();
			window.addEventListener(
				"online",
				() => (window.location.href = "/"),
			);
			async function reconnect() {
				const btn = document.getElementById("btn");
				btn.disabled = true;
				btn.innerHTML = '<span class="spin"></span>Checking...';
				try {
					await fetch("/?t=" + Date.now(), {
						cache: "no-store",
						mode: "no-cors",
					});
					window.location.href = "/";
				} catch {
					if ("vibrate" in navigator)
						navigator.vibrate([100, 50, 100]);
					btn.disabled = false;
					btn.textContent = "Try To Reconnect";
				}
			}
		</script>
	</body>
</html>
