<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="script-src 'unsafe-inline'; style-src 'unsafe-inline';"
		/>
		<title>Offline - Muhammad Sayyid</title>
		<style>
			body {
				background-color: #020617;
				color: white;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				text-align: center;
				padding: 20px;
			}
			.icon-container {
				position: relative;
				margin-bottom: 32px;
				width: 96px;
				height: 96px;
				background: #0f172a;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 0 20px rgba(8, 145, 178, 0.4);
			}
			.emoji {
				font-size: 48px;
			}
			.ping {
				position: absolute;
				top: -4px;
				right: -4px;
				width: 16px;
				height: 16px;
				background: #ef4444;
				border-radius: 50%;
				animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
			}
			@keyframes ping {
				75%,
				100% {
					transform: scale(2);
					opacity: 0;
				}
			}
			h1 {
				font-size: 2rem;
				margin-bottom: 8px;
				font-weight: bold;
			}
			p {
				color: #94a3b8;
				max-width: 400px;
				margin-bottom: 32px;
				line-height: 1.5;
			}
			#reconnect-btn {
				background: #0891b2;
				color: white;
				border: none;
				padding: 12px 32px;
				border-radius: 12px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.2s;
			}
			#reconnect-btn:hover {
				background: #06b6d4;
				transform: scale(1.05);
			}
			#reconnect-btn:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
			.spinner {
				display: inline-block;
				width: 16px;
				height: 16px;
				border: 2px solid white;
				border-top-color: transparent;
				border-radius: 50%;
				animation: spin 1s linear infinite;
				margin-right: 8px;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			footer {
				position: absolute;
				bottom: 32px;
				font-size: 0.875rem;
				color: #475569;
			}
		</style>
	</head>
	<body>
		<div class="icon-container">
			<span class="emoji">📡</span>
			<div class="ping"></div>
		</div>

		<h1>Oops! You're Offline</h1>
		<p>
			It seems you've lost your connection. Don't worry, my portfolio is
			designed to work even when you're disconnected!
		</p>

		<button id="reconnect-btn">Try To Reconnect</button>

		<footer>
			&copy; <span id="year"></span> Muhammad Sayyid • Developed with ❤️
		</footer>

		<script>
			document.getElementById("year").textContent =
				new Date().getFullYear();
			const btn = document.getElementById("reconnect-btn");

			btn.onclick = async function () {
				btn.disabled = true;
				btn.innerHTML = '<span class="spinner"></span> Checking...';

				try {
					await fetch("/favicon.ico", {
						cache: "no-store",
						mode: "no-cors",
					});
					window.location.href = "/";
				} catch (e) {
					console.log("Offline...");
					setTimeout(() => {
						btn.disabled = false;
						btn.innerHTML = "Try To Reconnect";
					}, 1500);
				}
			};
		</script>
	</body>
</html>
