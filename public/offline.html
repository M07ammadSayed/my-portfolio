<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Oops! You're Offline | Muhammad Sayyid</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			html,
			body,
			* {
				cursor: auto !important;
			}
		</style>
	</head>
	<body class="bg-[#020617]">
		<div
			class="flex min-h-screen flex-col items-center justify-center p-4 text-center"
		>
			<div
				class="relative mb-8 flex h-24 w-24 items-center justify-center rounded-full bg-slate-900 shadow-[0_0_20px_rgba(8,145,178,0.4)]"
			>
				<span class="text-5xl">📡</span>
				<div
					class="absolute -top-1 -right-1 h-4 w-4 animate-ping rounded-full bg-red-500"
				></div>
			</div>

			<h1
				class="mb-2 text-3xl font-bold tracking-tight text-white sm:text-4xl"
			>
				Oops! You're Offline
			</h1>

			<p class="mb-8 max-w-md text-slate-400">
				It seems you've lost your connection. Don't worry, my portfolio
				is designed to work even when you're disconnected!
			</p>

			<button
				id="reconnect-btn"
				onclick="tryReconnect()"
				class="group relative flex items-center justify-center overflow-hidden rounded-xl bg-cyan-600 px-8 py-3 font-semibold text-white transition-all hover:bg-cyan-500 hover:ring-2 hover:ring-cyan-400 hover:ring-offset-2 hover:ring-offset-[#020617] active:scale-95"
			>
				<span id="btn-text">Try To Reconnect</span>
				<span id="btn-loading" class="hidden flex items-center gap-2">
					<span
						class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
					></span>
					Checking...
				</span>
			</button>

			<footer class="absolute bottom-8 text-sm text-slate-600">
				&copy; <span id="year"></span> Muhammad Sayyid • Developed with
				❤️
			</footer>
		</div>

		<script>
			// Set Current Year
			document.getElementById("year").textContent =
				new Date().getFullYear();

			let isChecking = false;

			async function tryReconnect() {
				if (isChecking) return;

				const btnText = document.getElementById("btn-text");
				const btnLoading = document.getElementById("btn-loading");
				const btn = document.getElementById("reconnect-btn");

				isChecking = true;
				btnText.classList.add("hidden");
				btnLoading.classList.remove("hidden");
				btn.classList.add("opacity-50", "cursor-not-allowed");

				try {
					// Same logic as your React component
					await fetch(`/?t=${Date.now()}`, {
						cache: "no-store",
						mode: "no-cors",
					});
					// If fetch succeeds, redirect to home
					window.location.href = "/";
				} catch (error) {
					// If still offline, reset button state
					isChecking = false;
					btnText.classList.remove("hidden");
					btnLoading.classList.add("hidden");
					btn.classList.remove("opacity-50", "cursor-not-allowed");
				}
			}
		</script>
	</body>
</html>
