<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Muhammad Sayyid</title>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
        .card { background: #0f172a; padding: 2rem; border-radius: 1rem; box-shadow: 0 0 20px rgba(8,145,178,0.3); max-width: 400px; }
        h1 { color: #06b6d4; margin-top: 0; }
        p { color: #94a3b8; line-height: 1.6; }
        button { background: #0891b2; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 1rem; }
        button:hover { background: #06b6d4; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 50px;">📡</div>
        <h1>Oops! You're Offline</h1>
        <p>It seems you've lost your connection. Don't worry, my portfolio is designed to work even when you're disconnected!</p>
        <button id="retry-btn">Try To Reconnect</button>
    </div>

    <script>
        // استخدام onclick مباشرة لتجنب بعض قيود الـ CSP
        document.getElementById('retry-btn').onclick = function() {
            this.disabled = true;
            this.innerText = 'Checking...';
            
            // محاولة بسيطة لعمل reload
            window.location.href = '/?t=' + Date.now();
            
            setTimeout(() => {
                this.disabled = false;
                this.innerText = 'Try To Reconnect';
            }, 2000);
        };
    </script>
</body>
</html>
