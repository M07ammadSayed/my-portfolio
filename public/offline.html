<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
		/>
		<title>Offline - Muhammad Sayyid</title>
		<style>
			body {
				background: #020617;
				color: white;
				font-family: sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				text-align: center;
			}
			.card {
				background: #0f172a;
				padding: 2rem;
				border-radius: 1rem;
				border: 1px solid #1e293b;
				max-width: 400px;
			}
			h1 {
				color: #06b6d4;
			}
			button {
				background: #0891b2;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 8px;
				cursor: pointer;
				font-weight: bold;
				margin-top: 15px;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Oops! You're Offline</h1>
			<p>
				It seems you've lost your connection. My portfolio works
				offline, just try to reconnect!
			</p>
			<button onclick="window.location.reload()">Try To Reconnect</button>
		</div>
	</body>
</html>
