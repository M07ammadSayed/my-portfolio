<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Offline - Muhammad Sayyid</title>
	</head>
	<body
		style="
			background-color: #020617;
			color: white;
			font-family: sans-serif;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
		"
	>
		<div
			style="
				background-color: #0f172a;
				padding: 40px;
				border-radius: 20px;
				border: 1px solid #1e293b;
				max-width: 360px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			"
		>
			<div style="font-size: 60px; margin-bottom: 20px">📡</div>

			<h1
				style="
					color: #06b6d4;
					font-size: 24px;
					margin-bottom: 12px;
					font-weight: bold;
				"
			>
				Oops! You're Offline
			</h1>

			<p
				style="
					color: #94a3b8;
					font-size: 16px;
					line-height: 1.6;
					margin-bottom: 25px;
				"
			>
				It seems you've lost your connection. My portfolio is cached and
				ready for you to explore!
			</p>

			<button
				onclick="
					this.innerText = 'Checking...';
					window.location.reload();
				"
				style="
					background-color: #0891b2;
					color: white;
					border: none;
					padding: 14px 28px;
					border-radius: 10px;
					font-weight: bold;
					font-size: 16px;
					cursor: pointer;
					width: 100%;
				"
			>
				Try To Reconnect
			</button>

			<p style="margin-top: 25px; font-size: 12px; color: #475569">
				© Muhammad Sayyid • Developed with ❤️
			</p>
		</div>
	</body>
</html>
